<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holographic API Gateway Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 3D Hologram Grid Background Effect -->
    <div class="hologram-grid"></div>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="glass-panel">
        <div class="header-badge">SECURE GATEWAY v2.0</div>
        <h2>Holo-API Dashboard</h2>
        
        <form id="apiForm">
            <label>Project Name:</label>
            <input type="text" id="projectName" required placeholder="e.g., Cyber Bot">

            <label>Service Type:</label>
            <select id="serviceType">
                <option value="telegram">Telegram Bot</option>
                <option value="ai">AI Model</option>
                <option value="custom">Custom API</option>
            </select>

            <div id="tokenGroup">
                <label>API Token / Bot Token:</label>
                <input type="password" id="token" placeholder="Paste your token here" required>
            </div>

            <div id="chatIdGroup">
                <label style="display: flex; align-items: center; justify-content: space-between;">
                    Chat ID:
                    <small style="color: #38bdf8; display: flex; align-items: center; gap: 5px; cursor: pointer;">
                        <input type="checkbox" id="skipChatId" style="width: auto; margin: 0;"> Skip (Optional)
                    </small>
                </label>
                <input type="text" id="chatId" placeholder="Enter Chat ID">
            </div>

            <div id="aiModelGroup" class="hidden">
                <label>AI Model Name:</label>
                <input type="text" id="aiModel" placeholder="e.g., gemini-pro">
            </div>

            <button type="submit" id="submitBtn">Generate Hologram URL</button>
        </form>
        
        <!-- Error Box -->
        <div id="errorBox" class="hidden error-box">
            <h3>SERVER ERROR</h3>
            <p id="errorMsg"></p>
        </div>

        <!-- Result & Auto-Copy Box -->
        <div id="resultBox" class="hidden success-box">
            <p>Your Secure API URL:</p>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="shortUrl" readonly style="margin: 0;">
                <button id="copyBtn" class="mini-btn">Copy</button>
            </div>
            <small style="color: #34d399; display: block; margin-top: 6px;">⚡ Auto-copied to clipboard!</small>
        </div>

        <!-- History Section -->
        <div class="history-section">
            <div class="history-header">
                <span>Recent History (<span id="historyCount">0</span>)</span>
                <button id="clearHistory" class="clear-btn">Clear All</button>
            </div>
            <div id="historyList" class="history-list">
                <p class="empty-history">No links generated yet.</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
